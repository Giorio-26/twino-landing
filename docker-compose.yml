services:
  twino-landing:
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    ports:
      - "5000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
